name: Diagnose SSL/Deployment Issues

on:
  workflow_dispatch:
    inputs:
      auto_fix:
        description: "Attempt automatic fixes (reload nginx)"
        required: false
        default: "false"
        type: boolean

permissions: {}

jobs:
  diagnose:
    name: Run Diagnostics
    runs-on: ubuntu-latest

    steps:
      - name: Run diagnostic checks via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "=============================================="
            echo "🔍 IMMOCALC DIAGNOSTICS - $(date)"
            echo "=============================================="
            echo ""

            echo "=============================================="
            echo "📦 1. CONTAINER STATUS"
            echo "=============================================="
            echo "Checking immocalc containers..."
            docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}" | grep -E "immocalc|NAMES" || echo "⚠️  No matching containers found"
            echo ""

            echo "=============================================="
            echo "🌐 2. HOST PORT BINDING"
            echo "=============================================="
            echo "Checking if immocalc is bound to 127.0.0.1:3100..."
            if ss -tlnp 2>/dev/null | grep -q "127.0.0.1:3100"; then
              echo "✅ Port 3100 is bound to 127.0.0.1"
            else
              echo "❌ Port 3100 is NOT bound - container may not be running or port mapping is wrong"
            fi
            echo ""

            echo "=============================================="
            echo "🔌 3. INTERNAL CONNECTIVITY TEST"
            echo "=============================================="
            echo "Testing if nginx can reach immocalc on 127.0.0.1:3100..."
            if curl -s --connect-timeout 5 http://127.0.0.1:3100/api/health > /dev/null 2>&1; then
              echo "✅ Internal connectivity OK - app is reachable on 127.0.0.1:3100"
            else
              echo "❌ Internal connectivity FAILED - app is not reachable on 127.0.0.1:3100"
            fi
            echo ""

            echo "=============================================="
            echo "📄 4. NGINX CONFIGURATION"
            echo "=============================================="
            echo "Validating nginx configuration..."
            sudo nginx -t 2>&1 || echo "❌ nginx config validation failed"
            echo ""
            echo "Current nginx site config for immocalc:"
            cat /etc/nginx/sites-available/immocalc.festas-builds.com.conf 2>&1 || echo "❌ Could not read nginx site config"
            echo ""

            echo "=============================================="
            echo "📝 5. NGINX LOGS (ERRORS)"
            echo "=============================================="
            echo "Checking nginx error log for immocalc entries..."
            sudo grep -iE "immocalc|3100|error" /var/log/nginx/error.log 2>/dev/null | tail -50 || echo "No matching log entries found"
            echo ""

            echo "=============================================="
            echo "🌍 6. IMMOCALC APP RESPONSE TEST"
            echo "=============================================="
            echo "Testing if immocalc app responds internally..."
            docker exec immocalc curl -s --connect-timeout 5 http://localhost:3000 2>&1 | head -20 || echo "❌ App did not respond (curl may not be available in container)"
            echo ""
            echo "Alternative test with wget..."
            docker exec immocalc wget -qO- http://localhost:3000 --timeout=5 2>&1 | head -20 || echo "wget also failed or not available"
            echo ""

            echo "=============================================="
            echo "🏥 7. CONTAINER HEALTH STATUS"
            echo "=============================================="
            echo "Checking container health..."
            docker inspect immocalc --format '{{.State.Health.Status}}' 2>/dev/null || echo "No health check configured or container not found"
            echo ""

            echo "=============================================="
            echo "📊 8. DNS RESOLUTION CHECK"
            echo "=============================================="
            echo "Checking DNS for immocalc.festas-builds.com..."
            if command -v dig > /dev/null 2>&1; then
              dig +short immocalc.festas-builds.com || echo "DNS lookup failed"
            elif command -v nslookup > /dev/null 2>&1; then
              nslookup immocalc.festas-builds.com | tail -5 || echo "DNS lookup failed"
            elif command -v host > /dev/null 2>&1; then
              host immocalc.festas-builds.com || echo "DNS lookup failed"
            else
              echo "No DNS lookup tools available on server"
            fi
            echo ""

            echo "=============================================="
            echo "🔐 9. SSL CERTIFICATE STATUS"
            echo "=============================================="
            echo "Checking Let's Encrypt certificate for immocalc.festas-builds.com..."
            sudo certbot certificates 2>&1 | grep -A5 "immocalc" || echo "No certificate info found (certbot may not be installed or domain not listed)"
            echo ""

            echo "=============================================="
            echo "📋 DIAGNOSTICS COMPLETE"
            echo "=============================================="

      - name: Attempt automatic fixes
        if: ${{ inputs.auto_fix }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "=============================================="
            echo "🔧 AUTOMATIC FIX ATTEMPTS"
            echo "=============================================="
            echo ""

            echo "Step 1: Validating nginx configuration..."
            if sudo nginx -t 2>&1; then
              echo "✅ nginx config is valid"
              echo ""
              echo "Step 2: Reloading nginx..."
              if sudo systemctl reload nginx 2>&1; then
                echo "✅ nginx reloaded successfully"
              else
                echo "❌ nginx reload failed"
              fi
            else
              echo "❌ nginx config has errors - fix before reloading"
            fi
            echo ""

            echo "=============================================="
            echo "🔄 POST-FIX VERIFICATION"
            echo "=============================================="
            echo ""
            echo "Testing connectivity after fix..."
            if curl -s --connect-timeout 5 http://127.0.0.1:3100/api/health > /dev/null 2>&1; then
              echo "✅ App reachable on 127.0.0.1:3100"
            else
              echo "❌ App still not reachable on 127.0.0.1:3100"
            fi
            echo ""

            echo "=============================================="
            echo "🔧 AUTOMATIC FIX COMPLETE"
            echo "=============================================="

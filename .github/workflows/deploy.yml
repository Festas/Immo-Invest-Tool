name: Deploy to Hetzner

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_sha: ${{ steps.sha.outputs.short_sha }}
      # Wir übergeben den lowercase Namen an den nächsten Job
      image_name: ${{ steps.image_name.outputs.lowercase_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get short SHA
        id: sha
        run: echo "short_sha=$(echo ${{ github.sha }} | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Set image name to lowercase
        id: image_name
        # ${GITHUB_REPOSITORY,,} ist Bash syntax für toLowerCase
        run: echo "lowercase_name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # Wir nutzen hier den lowercase Namen
          tags: |
            ${{ env.REGISTRY }}/${{ steps.image_name.outputs.lowercase_name }}:${{ steps.sha.outputs.short_sha }}
            ${{ env.REGISTRY }}/${{ steps.image_name.outputs.lowercase_name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: read
      packages: read

    steps:
      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.2.4
        env:
          # Hier greifen wir auf die Outputs des vorigen Jobs zu
          IMAGE_SHA: ${{ needs.build-and-push.outputs.image_sha }}
          IMAGE_NAME: ${{ needs.build-and-push.outputs.image_name }}
          REGISTRY: ghcr.io
          DOMAIN: ${{ secrets.DOMAIN }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_ACTOR: ${{ github.actor }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # Diese Environment-Variablen werden an das Remote-Skript übergeben
          envs: IMAGE_SHA,IMAGE_NAME,REGISTRY,DOMAIN,GHCR_TOKEN,GHCR_ACTOR,JWT_SECRET,SESSION_SECRET,DB_PASSWORD
          script: |
            # Beende das Skript sofort bei Fehlern
            set -euo pipefail

            echo "Starting deployment for image: ${IMAGE_NAME}:${IMAGE_SHA}"

            DEPLOY_DIR="/home/deploy/immocalc"
            mkdir -p "${DEPLOY_DIR}"
            cd "${DEPLOY_DIR}"

            echo "[1/6] Writing configuration..."
            # Erstelle .env Datei mit Datenbank-Konfiguration
            cat > .env << EOF
            NODE_ENV=production
            JWT_SECRET=${JWT_SECRET}
            SESSION_SECRET=${SESSION_SECRET}
            DOMAIN=${DOMAIN}
            DB_PASSWORD=${DB_PASSWORD}
            DATABASE_URL=postgresql://immo_user:${DB_PASSWORD}@db:5432/immo_invest?schema=public
            EOF

            echo "[2/6] Authenticating & Pulling..."
            echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_ACTOR}" --password-stdin
            docker pull "${REGISTRY}/${IMAGE_NAME}:${IMAGE_SHA}"

            echo "[3/6] Generating Docker Compose..."
            # Docker Compose mit PostgreSQL
            cat > docker-compose.yml <<EOF_COMPOSE
            services:
              # PostgreSQL Database
              db:
                image: postgres:16.6-alpine
                container_name: immocalc-db
                restart: unless-stopped
                environment:
                  POSTGRES_USER: immo_user
                  POSTGRES_PASSWORD: ${DB_PASSWORD}
                  POSTGRES_DB: immo_invest
                volumes:
                  - postgres-data:/var/lib/postgresql/data
                healthcheck:
                  test: ["CMD-SHELL", "pg_isready -U immo_user -d immo_invest"]
                  interval: 5s
                  timeout: 5s
                  retries: 5
                deploy:
                  resources:
                    limits:
                      memory: 256M

              # ImmoCalc Application
              immocalc:
                image: ${REGISTRY}/${IMAGE_NAME}:${IMAGE_SHA}
                container_name: immocalc
                restart: unless-stopped
                ports:
                  # IMPORTANT: This port MUST match proxy_pass in
                  # Festas/Link-in-Bio nginx/sites-available/immocalc.festas-builds.com.conf
                  - "127.0.0.1:3100:3000"
                env_file:
                  - .env
                depends_on:
                  db:
                    condition: service_healthy
                deploy:
                  resources:
                    limits:
                      memory: 512M

            volumes:
              postgres-data:
                driver: local
            EOF_COMPOSE

            echo "[4/6] Restarting Containers..."
            docker compose down --remove-orphans || true
            docker compose up -d

            # Kurzer Check ob die Container laufen
            if [ "$(docker inspect -f '{{.State.Running}}' immocalc 2>/dev/null)" = "true" ]; then
                echo "✅ App container is running."
            else
                echo "❌ App container is NOT running. Logs:"
                docker logs immocalc --tail 30
                exit 1
            fi

            if [ "$(docker inspect -f '{{.State.Running}}' immocalc-db 2>/dev/null)" = "true" ]; then
                echo "✅ Database container is running."
            else
                echo "❌ Database container is NOT running. Logs:"
                docker logs immocalc-db --tail 30
                exit 1
            fi

            echo "[5/6] Running database migrations..."
            # Run Prisma migrations
            if ! docker compose exec -T immocalc npx prisma migrate deploy 2>&1; then
                echo "⚠️ Migration deployment failed. This might be the first deployment."
                echo "Attempting to initialize database schema with db push..."
                if ! docker compose exec -T immocalc npx prisma db push 2>&1; then
                    echo "❌ Database setup failed! Showing logs:"
                    echo "=== App Container Logs ==="
                    docker logs immocalc --tail 50
                    echo "=== Database Container Logs ==="
                    docker logs immocalc-db --tail 30
                    exit 1
                fi
                echo "✅ Database schema initialized successfully."
            else
                echo "✅ Migrations applied successfully."
            fi

            echo "✅ Deployment finished successfully!"

            echo "[6/6] Health check..."
            # Verify the app responds on the host port (which nginx proxies to)
            # Accepts both 200 (healthy/degraded) and 503 (unhealthy but running)
            MAX_RETRIES=10
            SLEEP_SECONDS=5
            APP_URL="http://127.0.0.1:3100/api/health"
            for i in $(seq 1 $MAX_RETRIES); do
                HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${APP_URL}" 2>/dev/null || echo "000")
                if [ "${HTTP_STATUS}" = "200" ] || [ "${HTTP_STATUS}" = "503" ]; then
                    echo "✅ Health check passed (HTTP ${HTTP_STATUS}) after ${i} attempt(s)."
                    break
                fi
                if [ "$i" -eq "$MAX_RETRIES" ]; then
                    echo "❌ Health check failed after ${MAX_RETRIES} attempts (last HTTP status: ${HTTP_STATUS})."
                    echo "nginx will return 502 Bad Gateway. Container logs:"
                    docker logs immocalc --tail 50
                    exit 1
                fi
                echo "⏳ Attempt ${i}/${MAX_RETRIES}: HTTP ${HTTP_STATUS} — retrying in ${SLEEP_SECONDS}s..."
                sleep "${SLEEP_SECONDS}"
            done

            # Aufräumen (Images älter als 24h)
            docker image prune -f --filter "until=24h"



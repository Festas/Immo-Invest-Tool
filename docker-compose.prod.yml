# ImmoCalc - Production Docker Compose
# Uses nginx reverse proxy on the host for HTTPS

services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: immocalc-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: immo_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD environment variable is required}
      POSTGRES_DB: immo_invest
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U immo_user -d immo_invest"]
      interval: 5s
      timeout: 5s
      retries: 5

  immocalc:
    image: ghcr.io/festas/immo-invest-tool:latest
    container_name: immocalc
    restart: unless-stopped
    ports:
      - "127.0.0.1:3100:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://immo_user:${DB_PASSWORD:?DB_PASSWORD environment variable is required}@db:5432/immo_invest?schema=public
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3000/api/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  postgres-data:
    driver: local

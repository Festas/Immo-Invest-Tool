# ImmoCalc - Docker Compose für Produktion
# Mit PostgreSQL Datenbank

services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: immocalc-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: immo_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme_in_production}
      POSTGRES_DB: immo_invest
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U immo_user -d immo_invest"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - caddy-network
    # No external port - only accessible internally!

  # ImmoCalc Next.js Application
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: immocalc
    restart: unless-stopped
    ports:
      - "8086:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://immo_user:${DB_PASSWORD:-changeme_in_production}@db:5432/immo_invest?schema=public
      - JWT_SECRET=${JWT_SECRET}
      # Optional: AI Integration
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - NEXT_PUBLIC_GOOGLE_MAPS_KEY=${NEXT_PUBLIC_GOOGLE_MAPS_KEY}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3000/api/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - caddy-network

volumes:
  postgres-data:
    driver: local

networks:
  caddy-network:
    external: true
